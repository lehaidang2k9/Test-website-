<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudX — Hải Đăng</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <style>
        /* GIỮ NGUYÊN CSS TỪ FILE PHP CỦA BẠN */
        :root { --primary: #8b5cf6; --bg: #050508; --card-bg: #111118; --border: rgba(255, 255, 255, 0.1); --text: #ffffff; --danger: #ff4d4d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 15px 15px 80px 15px; min-height: 100vh; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; position: relative; }
        .header h1 { font-size: 22px; font-weight: 800; }
        .header h1 span { color: var(--primary); }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(17, 17, 24, 0.8); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 5000; }
        .nav-item { color: #888; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 24px; }
        .nav-item small { font-size: 10px; font-weight: 600; }
        .stats { display: flex; gap: 8px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 20px; text-align: center; }
        .stat-val { font-size: 18px; font-weight: 800; color: #ffffff; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .item-wrapper { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--card-bg); }
        .file-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 7px; padding: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<nav class="nav-bar">
    <a href="#" class="nav-item active"><span class="material-symbols-outlined">home</span><small>Trang chủ</small></a>
    <a href="#" class="nav-item"><span class="material-symbols-outlined">chat</span><small>Tin nhắn</small></a>
    <a href="#" class="nav-item"><span class="material-symbols-outlined">group</span><small>Bạn bè</small></a>
    <a href="#" class="nav-item"><span class="material-symbols-outlined">person</span><small>Hồ sơ</small></a>
</nav>

<div class="container">
    <div class="header">
        <h1>Hải Đăng <span>CloudX</span></h1>
        <div class="avatar">H</div>
    </div>

    <div class="stats">
        <div class="stat-box"><small>Tổng tệp</small><div><span class="stat-val" id="count-files">0</span></div></div>
        <div class="stat-box"><small>Dung lượng</small><div><span class="stat-val" id="count-size">0</span><span id="unit-size" style="font-size:11px; color:#888; margin-left:2px">B</span></div></div>
    </div>

    <div class="grid" id="fileGrid">
        </div>
</div>

<script>
    function formatSize(bytes) {
        if (bytes <= 0) return { val: 0, unit: 'B' };
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        const units = ['B', 'KB', 'MB', 'GB'];
        return { val: (bytes / Math.pow(1024, i)).toFixed(1), unit: units[i] };
    }

    async function loadData() {
        try {
            const res = await fetch('/api/files');
            const data = await res.json();

            document.getElementById('count-files').innerText = data.totalCount;
            const sizeInfo = formatSize(data.totalSize);
            document.getElementById('count-size').innerText = sizeInfo.val;
            document.getElementById('unit-size').innerText = sizeInfo.unit;

            const grid = document.getElementById('fileGrid');
            grid.innerHTML = data.files.map(f => `
                <div class="item-wrapper">
                    <div class="item">
                        ${f.mime_type.startsWith('image/') ? `<img src="${f.url}" style="width:100%;height:100%;object-fit:cover">` : 
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%"><span style="font-size:20px">${f.mime_type.includes('video') ? '🎬' : '📄'}</span></div>`}
                        <div class="file-name">${f.original_name}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) { console.error("Lỗi tải dữ liệu", e); }
    }
    window.onload = loadData;
</script>
</body>
</html>
