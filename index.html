<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Karaoke</title>
    <style>
        :root { --primary: #ff0000; --bg: #0f0f0f; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: white; }
        
        .layout { display: flex; flex-direction: column; height: 100vh; }
        
        /* Màn hình Video */
        .video-box { width: 100%; background: #000; aspect-ratio: 16/9; }
        #player { width: 100%; height: 100%; }

        /* Danh sách bài hát */
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: var(--card); color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }

        .playlist { display: grid; gap: 15px; }
        .song-card { 
            display: flex; gap: 15px; background: var(--card); padding: 10px; 
            border-radius: 12px; cursor: pointer; transition: 0.3s; 
        }
        .song-card:hover { transform: scale(1.02); background: #2a2a2a; }
        .song-card img { width: 120px; border-radius: 8px; object-fit: cover; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 16px; }
        .song-info p { margin: 0; font-size: 13px; color: #aaa; }

        /* Responsive cho PC */
        @media (min-width: 1024px) {
            .layout { flex-direction: row; }
            .video-box { flex: 7; height: 100vh; aspect-ratio: auto; }
            .content { flex: 3; }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="video-box">
        <div id="player"></div>
    </div>

    <div class="content">
        <div class="search-bar">
            <input type="text" id="youtubeUrl" placeholder="Dán link YouTube vào đây để hát...">
            <button onclick="playCustomVideo()">Hát ngay</button>
        </div>

        <h3>Bài hát gợi ý</h3>
        <div id="playlist" class="playlist">
            </div>
    </div>
</div>

<script>
    // 1. Danh sách bài hát (Bạn có thể tự thêm bài mình thích vào đây)
    const mySongs = [
        { id: '60ItHLz5WEA', title: 'Ngủ Một Mình', artist: 'HIEUTHUHAI' },
        { id: 'L7H9no_v_Sg', title: 'Ai Chung Tình Được Mãi', artist: 'Karaoke Beat' },
        { id: '3f6O_ZID99A', title: 'Khóa Ly Biệt', artist: 'Anh Tú' },
        { id: '9p_NnI-rZxs', title: 'Mưa Nửa Đêm', artist: 'Lệ Quyên (Karaoke)' }
    ];

    // 2. Khởi tạo YouTube Player API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: mySongs[0].id, // Bài mặc định
            playerVars: { 'autoplay': 1, 'rel': 0 },
        });
    }

    // 3. Hiển thị danh sách bài hát ra màn hình
    const playlistEl = document.getElementById('playlist');
    mySongs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
            <img src="https://img.youtube.com/vi/${song.id}/mqdefault.jpg">
            <div class="song-info">
                <h4>${song.title}</h4>
                <p>${song.artist}</p>
            </div>
        `;
        card.onclick = () => player.loadVideoById(song.id);
        playlistEl.appendChild(card);
    });

    // 4. Hàm để hát từ Link bất kỳ
    function playCustomVideo() {
        const url = document.getElementById('youtubeUrl').value;
        const videoId = extractVideoID(url);
        if (videoId) {
            player.loadVideoById(videoId);
        } else {
            alert("Link không đúng rồi bạn ơi!");
        }
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
</script>

</body>
</html>
